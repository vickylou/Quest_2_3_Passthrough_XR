<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Inheritance Calculator">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <!-- Rounded square so iOS doesn't double-mask the corners -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- Four sister-colour dots in the corners -->
  <circle cx="120" cy="120" r="44" fill="#16a34a"/>
  <circle cx="392" cy="120" r="44" fill="#eab308"/>
  <circle cx="120" cy="392" r="44" fill="#dc2626"/>
  <circle cx="392" cy="392" r="44" fill="#9333ea"/>
  <!-- € in the centre, white -->
  <text x="256" y="350" font-family="Georgia, 'Times New Roman', serif" font-size="320" font-weight="700" fill="#ffffff" text-anchor="middle">€</text>
</svg>
